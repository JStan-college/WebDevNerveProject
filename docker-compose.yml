
services: 
 mongo:
   image: mongodb/mongodb-enterprise-server
   container_name: mongodb
   ports:
     - "27017:27017"
   volumes:
     - mongo-data:/data/db

 backend:
   build: ./backend
   container_name: backend-container
   ports:
     - "5000:5000" 
   environment:
     - MONGO_URI=mongodb://mongo:27017/mydatabase
   depends_on:
     - mongo
 
 frontend:
   build: ./frontend
   container_name: frontend-container
   ports:
     - "3000:3000"
   depends_on:
     - backend

volumes:
  mongo-data: 
